[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "navdhrishti"
version = "1.0.0"
description = "NavDhrishti: Automated Industrial Surface Defect & Quality Inspection System by Tatvik Sinha"
readme = "README.md"
authors = [{ name = "Tatvik Sinha" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "rich>=13.0.0",
    "reportlab>=4.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0"
]

[project.scripts]
navdhrishti = "navdhrishti.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
